site_name: PsychScanner
site_url: https://saurabhr.github.io/psychscanner
site_description: A framework for running psychological experiments with large language models.
site_author: Saurabh Ranjan
repo_url: https://github.com/saurabhr/psychscanner
repo_name: saurabhr/psychscanner

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocs-jupyter:
      include: ["tutorials/*.ipynb"]
      execute: false
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: usage.md
    - Configuration: configuration.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Quickstart: tutorials/00_quickstart.ipynb
    - Local Models with Ollama: tutorials/01_ollama_local_models.ipynb
    - Parameters Reference: tutorials/02_parameters_reference.ipynb
    - Parsers: tutorials/03_parsers.ipynb
    - Parser Modules: tutorials/04_parser_modules.ipynb
    - Reality Monitoring Task: tutorials/05_rm_task.ipynb
    - Feedback API: tutorials/06_feedback_api.ipynb
    - Reality Monitoring with Feedback: tutorials/07_rm_feedback_task.ipynb
    - Parser System Guide: tutorials/08_ps_parser_guide.ipynb
    - VVIQ-16 Study: tutorials/09_vviq16_study.ipynb
    - Bring Your Own LLM/VLM: tutorials/10_custom_agents.ipynb
    - Conversation Memory & Context Quantization: tutorials/11_memory_context_management.ipynb
    - Tool Binding and Multimodal Stimuli: tutorials/12_tool_binding_and_multimodal.ipynb
    - A Real Tool-Calling Loop: tutorials/13_react_tool_agent.ipynb
    - A Multimodal Supervisor/Planner/Worker Agent: tutorials/14_supervisor_multiagent.ipynb
    - A Modular Planner/Executor/Validator Agent: tutorials/15_planner_executor_agent.ipynb
    - Reflection Agents: tutorials/16_reflection_agents.ipynb
    - "Cognitive RL: Bandits and the Prisoner's Dilemma": tutorials/17_cognitive_rl_bandits_and_pd.ipynb
  - User Guide:
    - Overview: guides/index.md
    - PsychScanner Workflow: guides/psychscanner_workflow.md
    - Memory Types: guides/memory_types.md
    - Cognitive Tasks: guides/cognitive_tasks.md
    - Survey Tasks: guides/survey_tasks.md
    - Custom Parsers: guides/custom_parsers.md
    - Session Recovery: guides/session_recovery.md
  - Examples:
    - Overview: examples/index.md
    - Basic Survey: examples/basic_survey.md
    - Reality Monitoring: examples/reality_monitoring.md
    - Feedback Loop: examples/feedback_loop.md
    - Multi-Persona: examples/multi_persona.md
  - API Reference:
    - Overview: api/index.md
    - ExpCard: api/expcard.md
    - ScannerModel: api/scanner_model.md
    - Parsers: api/parsers.md
    - SessionTunnel: api/session_tunnel.md
  - CLI: cli.md
  - Deployment: deployment.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
